<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <body>
      <div class="container">
        <h1>Password Generator</h1>

        <label for="length">Password Length:</label>
        <input type="number" id="length" min="1" max="50" />

        <div class="options">
          <div class="option">
            <input type="checkbox" id="op1" />
            <label for="op1">Lowercase</label>
          </div>

          <div class="option">
            <input type="checkbox" id="op2" />
            <label for="op2">Uppercase</label>
          </div>

          <div class="option">
            <input type="checkbox" id="op3" />
            <label for="op3">Symbols</label>
          </div>

          <div class="option">
            <input type="checkbox" id="op4" />
            <label for="op4">Numbers</label>
          </div>
        </div>

        <button onclick="generatepass()">Generate Password</button>

        <div class="result-wrapper">
          <h2 id="result"></h2>
          <button
            type="button"
            id="copyBtn"
            class="copy-btn"
            onclick="copyPassword()"
            title="Copy password"
            aria-label="Copy password"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </body>
    <script>
      function generatepass() {
        let length = document.getElementById("length").value;
        let lowercase = document.getElementById("op1").checked;
        let uppercase = document.getElementById("op2").checked;
        let symbols = document.getElementById("op3").checked;
        let numbers = document.getElementById("op4").checked;

        console.log(lowercase, uppercase, symbols, numbers);
        if (length <= 0) {
          alert("Please enter a valid password length greater than 0.");
          return;
        }

        // Condition 2: At least one checkbox must be selected
        if (!lowercase && !uppercase && !symbols && !numbers) {
          alert("Please select at least one character type.");
          return;
        }
        const lower = "abcdefghijklmnopqrstuvwxyz";
        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const nums = "1234567890";
        const symb = "!@#$%^&*()_-?/";

        let password = "";
        let allowedchar = "";
        allowedchar += lowercase ? lower : "";
        allowedchar += uppercase ? upper : "";
        allowedchar += symbols ? symb : "";
        allowedchar += numbers ? nums : "";

        for (let i = 0; i < length; i++) {
          let randomindex = Math.floor(Math.random() * allowedchar.length);
          password += allowedchar[randomindex];
        }

        document.getElementById("result").textContent = password;
      }

      function copyPassword() {
        const password = document.getElementById("result").textContent;

        if (!password) {
          showToast("Nothing to copy yet!");
          return;
        }

        navigator.clipboard
          .writeText(password)
          .then(() => showToast("Password copied to clipboard!"))
          .catch(() => showToast("Failed to copy password."));
      }

      let toastTimeout;
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }
    </script>
  </body>
</html>
